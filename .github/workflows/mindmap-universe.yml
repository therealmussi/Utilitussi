name: CI — MindMap Universe

on:
  push:
    branches: ["**"]
    paths: ["apps/mindmap-universe/**"]
  pull_request:
    paths: ["apps/mindmap-universe/**"]

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mindmap-universe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mindmap-universe/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
